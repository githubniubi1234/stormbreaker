<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型比较 · stormbreaker</title>
<style>
:root{--ink:#21332f;--muted:#65746e;--line:#dce3df;--accent:#176b58;--paper:#fff;--wash:#f4f6f3;--soft:#eaf3ee}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 11px;font-weight:550}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c98428;outline-offset:2px}
select,input{background:white;border:1px solid var(--line);border-radius:5px;padding:7px 9px;max-width:100%}input[type=checkbox]{accent-color:var(--accent)}a{color:var(--accent)}[hidden]{display:none!important}
main{max-width:1560px;margin:0 auto;padding:28px 32px 36px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.brand{font-size:12px;font-weight:650;letter-spacing:1.4px;color:var(--accent);margin-bottom:5px}h1{font-size:27px;font-weight:650;letter-spacing:-.5px;margin:0 0 4px}h2{font-size:17px;font-weight:650;margin:0}
.muted{color:var(--muted)}#summary{font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar{background:var(--paper);border:1px solid var(--line);padding:14px 16px 12px;border-radius:7px 7px 0 0}
.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.control{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.control select,.control input{font-size:14px;color:var(--ink)}
.control.grow{flex:1;min-width:180px}.control.grow input{width:100%}.view-settings{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:12px;font-size:13px}.view-settings label{display:flex;align-items:center;gap:5px}
details.settings{position:relative}summary{cursor:pointer;color:var(--accent);font-weight:550}.dataset-settings{position:absolute;top:26px;left:0;z-index:12;background:white;border:1px solid var(--line);padding:14px;min-width:330px;max-width:540px;border-radius:6px;box-shadow:0 6px 18px #20382c15}
.dataset-setting{display:grid;grid-template-columns:24px 1fr 132px;align-items:center;gap:7px;margin:5px 0}.dataset-setting span{overflow-wrap:anywhere}.dataset-setting select{padding:4px 5px;font-size:12px}
.matrix-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 18px 12px;background:white;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.matrix-heading .meta{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted)}.scale{display:flex;align-items:center;gap:7px}.scale i{display:inline-block;width:62px;height:9px;background:linear-gradient(90deg,#f8fafb,#7ab7b1);border:1px solid #d2dfda}
.table-region{background:white;border:1px solid var(--line);border-top:0;border-radius:0 0 7px 7px;overflow:auto;max-height:72vh}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid #e8ece9;padding:10px 9px;text-align:left;vertical-align:middle;overflow-wrap:anywhere}thead th{position:sticky;top:0;z-index:3;background:#f0f4f1;font-size:12px;font-weight:600;border-bottom:1px solid #cbd8d0}
thead th.col-index{width:42px}thead th.col-selector{width:17%}thead th.col-learner{width:23%}th.metric-head{text-align:center}th.metric-head button{border:0;background:transparent;padding:0;width:100%;font-weight:650;font-size:12px;line-height:1.35}
.role{display:block;margin-top:3px;color:var(--muted);font-weight:400;font-size:11px}.metric-head.sorted{box-shadow:inset 0 -3px var(--accent)}
tbody tr:hover td:not(.metric-cell){background:#f5f8f4}.row-index{font-size:12px;color:var(--muted);text-align:center}.selector-label{font-size:13px;font-weight:500}
.model-button{border:0;padding:0;background:transparent;text-align:left;font-weight:650;font-size:13px;border-radius:0}.model-button:hover{background:transparent;color:var(--accent);text-decoration:underline}
.variant{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}.metric-cell{text-align:center;font-size:14px;font-weight:600;border-left:2px solid white;border-right:2px solid white}
.metric-cell.missing{background:#f5f5f3;color:#919892;font-weight:400}.mean-cell{border-left:4px solid white}
.empty{padding:45px 20px;text-align:center;background:white;color:var(--muted)}
.bottom-bar{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:12px 1px;font-size:12px;color:var(--muted)}.pagination{display:flex;gap:10px;align-items:center}.pagination button{font-size:12px;padding:5px 9px}
.notice{padding:10px 13px;border:1px solid #d2ddd5;border-radius:5px;background:white;margin-bottom:12px;font-size:13px}
.notice.error{border-color:#cc8e7c;color:#873e28;background:#fff9f5}
.export-box{background:white;padding:15px;border:1px solid var(--line);border-radius:6px;margin:12px 0}.export-box textarea{display:block;width:100%;height:120px;margin-top:8px;border:1px solid var(--line);resize:vertical;font-family:monospace;font-size:12px}
.help{margin-top:10px;font-size:13px;color:var(--muted)}.help summary{font-size:13px;color:var(--muted);font-weight:500}.help p{max-width:950px;margin:8px 0}.help code{background:#edf1ed;padding:1px 4px}
dialog{width:min(800px,calc(100% - 32px));border:1px solid #cad7ce;border-radius:8px;padding:24px;max-height:88vh;color:var(--ink)}dialog::backdrop{background:#132b2259}
.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:16px}.dialog-head button{padding:3px 9px}.model-meta{display:grid;grid-template-columns:100px 1fr;gap:8px 14px;font-size:13px}.model-meta dt{color:var(--muted)}.model-meta dd{margin:0;overflow-wrap:anywhere}
dialog table{margin-top:20px;table-layout:auto;font-size:13px}dialog th{position:static}dialog code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#f4f6f3;padding:10px;margin-top:7px}
.mobile-only{display:none}.download-line{display:flex;justify-content:space-between;gap:12px;align-items:center}
@media(min-width:1600px){main{padding-top:36px}th,td{padding-top:12px;padding-bottom:12px}}
@media(max-width:760px){main{padding:17px 12px}header{align-items:start;flex-direction:column;gap:12px;margin-bottom:15px}h1{font-size:23px}.actions{width:100%}.actions button{flex:1;padding:7px}.filters{gap:9px}.control{min-width:calc(50% - 9px);flex:1}.control.grow{min-width:100%}.toolbar{padding:12px}.view-settings{gap:12px}.dataset-settings{min-width:0;width:min(330px,calc(100vw - 50px));left:-2px}.dataset-setting{grid-template-columns:22px minmax(0,1fr) 112px}.matrix-heading{align-items:start;padding:14px 12px 10px}.matrix-heading .meta{display:block;text-align:right}.scale{margin-top:4px;font-size:11px}
.table-region{max-height:none;overflow:visible;background:transparent;border:0}#matrix thead{display:none}#matrix,#matrix tbody{display:block}
#matrix tbody tr{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px;padding:9px 12px 12px;border:1px solid var(--line);border-radius:6px;background:white;gap:5px 8px}
#matrix td{display:block;border:0;padding:5px 7px;min-width:0}#matrix td.row-index{display:none}#matrix td.selector-label{grid-column:1/-1;padding:4px 0 0;color:var(--muted);font-size:12px}#matrix td.selector-label:before{content:"Selector · ";color:#7b8881}
#matrix td.learner-cell{grid-column:1/-1;padding:0 0 8px}.model-button{font-size:15px}.variant{display:inline;margin-left:8px}
#matrix td.metric-cell{border-radius:4px;text-align:left;font-size:17px;padding:6px 9px}#matrix td.metric-cell:before{content:attr(data-label);display:block;font-size:10px;font-weight:500;color:#465e55;white-space:normal}
.bottom-bar{align-items:start;flex-direction:column}.model-meta{grid-template-columns:80px 1fr}.download-line{align-items:start;flex-direction:column}
}
@media print{@page{size:landscape;margin:12mm}body{background:white;font-size:10px}main{max-width:none;padding:0}header{margin-bottom:12px}h1{font-size:20px}.actions,.toolbar,.pagination,.help,.export-box,.notice,dialog{display:none!important}.matrix-heading{padding:8px 0;border:0}.table-region{max-height:none;overflow:visible;border:0}table{font-size:10px}thead{display:table-header-group}thead th{position:static}.model-button{font-size:10px}th,td{padding:6px}tr{break-inside:avoid}.metric-cell{font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bottom-bar{font-size:10px}}
</style>
</head>
<body>
<main>
<header>
  <div><div class="brand">STORMBREAKER</div><h1 id="page-title">模型比较</h1><div id="summary" class="muted"></div></div>
  <div class="actions">
    <button id="import-button">导入结果</button>
    <button id="csv-button">导出表格</button>
    <button id="svg-button">导出图 SVG</button>
    <button id="print-button">打印 / PDF</button>
  </div>
</header>
<input id="file-input" type="file" accept=".csv,text/csv" multiple hidden>
<div id="notice" class="notice" role="status" hidden></div>
<section class="toolbar" aria-label="结果筛选">
  <div class="filters">
    <label class="control">任务<select id="task"><option value="binary">二分类</option><option value="survival">生存预测</option></select></label>
    <label class="control">指标<select id="metric"></select></label>
    <label class="control" id="horizon-control" hidden>预测时点<select id="horizon"></select></label>
    <label class="control">排序依据<select id="sort"></select></label>
    <label class="control">显示<select id="limit"><option value="10">前 10</option><option value="20" selected>前 20</option><option value="50">前 50</option><option value="100">前 100</option><option value="all">全部</option></select></label>
    <label class="control grow">搜索<input id="search" type="search" placeholder="算法或筛选方法" aria-label="搜索算法或筛选方法"></label>
  </div>
  <div class="view-settings">
    <details class="settings" id="dataset-menu"><summary>数据集与用途</summary><div id="dataset-settings" class="dataset-settings"></div></details>
    <label><input id="mean" type="checkbox">验证集均值</label>
    <label><input id="complete" type="checkbox">只看各列均有结果的管道</label>
  </div>
</section>
<div class="matrix-heading">
  <h2 id="matrix-title">模型表现</h2>
  <div class="meta"><span id="row-count"></span><span class="scale"><span>较低</span><i aria-hidden="true"></i><span>较高</span></span></div>
</div>
<div class="table-region" role="region" aria-label="模型与数据集指标矩阵" tabindex="0">
  <table id="matrix"><thead></thead><tbody></tbody></table>
  <div class="empty" id="empty" hidden>暂无匹配的结果。</div>
</div>
<div class="bottom-bar">
  <span id="sort-note"></span>
  <div class="pagination"><button id="previous">上一页</button><span id="pagination-label"></span><button id="next">下一页</button></div>
</div>
<section id="export-box" class="export-box" hidden>
  <div class="download-line"><span id="export-status"></span><a id="download-link" download>保存文件</a><button id="close-export">收起</button></div>
  <textarea id="csv-preview" aria-label="可复制的 CSV 数据" readonly hidden></textarea>
</section>
<details class="help"><summary>指标与数据说明</summary>
  <p>AUC、C-index 越高越好；Brier、Log loss 越低越好。“—”表示无可用结果。</p>
  <p>验证集均值按当前显示的验证队列等权计算，缺列不计算。点击算法名称可看参数。</p>
</details>
</main>
<dialog id="model-dialog" aria-labelledby="detail-title">
  <div class="dialog-head"><div><h2 id="detail-title"></h2><div id="detail-selector" class="muted"></div></div><button id="close-dialog" aria-label="关闭详情">关闭</button></div>
  <dl class="model-meta" id="model-meta"></dl>
  <table id="detail-table"><thead><tr><th>数据集</th><th>用途</th><th>数值</th><th>状态</th></tr></thead><tbody></tbody></table>
  <details class="help"><summary>配置与内部编号</summary><code id="detail-parameters"></code><code id="detail-id"></code></details>
</dialog>
<script>
"use strict";
const REPORT = /*SB_REPORT_DATA*/null;
let report = REPORT || {title:"模型比较",models:[],cells:[],datasets:[],default_sort:""};
const $ = id => document.getElementById(id);
const roleNames = {development_cv:"训练集 · 交叉验证",training:"训练集 · 拟合",validation:"验证集",test:"测试集",external:"外部队列",repeated_cv:"训练集 · 重复CV",internal_external_cv:"留队列验证",unspecified:"未指定"};
const metricInfo = {
  roc_auc:{name:"ROC AUC",task:"binary",higher:true,bounded:true},
  average_precision:{name:"Average precision",task:"binary",higher:true,bounded:true},
  brier_score:{name:"Brier score",task:"binary",higher:false,bounded:true},
  log_loss:{name:"Log loss",task:"binary",higher:false,bounded:false},
  harrell_c:{name:"Harrell C-index",task:"survival",higher:true,bounded:true},
  time_auc:{name:"时间依赖 AUC",task:"survival",higher:true,bounded:true,horizon:true},
  uno_c:{name:"Uno C-index",task:"survival",higher:true,bounded:true,horizon:true},
  ipcw_brier:{name:"IPCW Brier score",task:"survival",higher:false,bounded:true,horizon:true}
};
let selectedDatasets = new Set(), page=0, rowsNow=[], allRows=[], exportRows=[], columnsNow=[], byCell=new Map(), objectUrl=null;
const el = (tag,text,className) => {const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;};
const option = (value,text) => {const node=el("option",text);node.value=value;return node;};
const finite = v => typeof v==="number" && Number.isFinite(v);
const cellKey = (task,model,dataset,metric) => JSON.stringify([task,model,dataset,metric]);
const horizonKey = cell => JSON.stringify([cell.horizon===undefined?null:cell.horizon,cell.time_unit||""]);
const format = value => finite(value)?value.toFixed(3):"—";
const statusName = cell => !cell?"未评估":cell.available?"完成":cell.run_status!=="success"?"运行未完成":cell.metric_status==="not_requested"?"未请求该指标":"指标不可用";
function announce(message,error=false){$("notice").hidden=!message;$("notice").textContent=message;$("notice").className="notice"+(error?" error":"");}
function closeExport(){ $("export-box").hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;} }
function activeCell(model,dataset){
  const c=byCell.get(cellKey($("task").value,model.id,dataset,$("metric").value));
  if(c && metricInfo[$("metric").value].horizon && horizonKey(c)!==$("horizon").value)return null;
  return c;
}
function datasetList(){return report.datasets.filter(d=>selectedDatasets.has(d.id)&&report.cells.some(c=>c.task===$("task").value&&c.dataset===d.id));}
function validationMean(model,ds){
  const validation=ds.filter(d=>d.role==="validation");
  if(!validation.length)return null;
  const cells=validation.map(d=>activeCell(model,d.id));
  if(cells.some(c=>!c||!c.available||!finite(c.estimate)))return null;
  const target=cells.map(c=>JSON.stringify([c.task,c.metric,c.horizon===undefined?null:c.horizon,c.time_unit||"",c.scope||"",c.aggregation||""]));
  if(new Set(target).size!==1)return null;
  return cells.reduce((sum,c)=>sum+c.estimate,0)/cells.length;
}
function color(value){
  const metric=metricInfo[$("metric").value];let ratio=value;
  if(!metric.bounded){const values=report.cells.filter(c=>c.metric===$("metric").value&&c.available&&finite(c.estimate)).map(c=>c.estimate);ratio=value/(Math.max(1,...values));}
  ratio=Math.max(0,Math.min(1,ratio));
  const start=[248,250,251],end=[122,183,177];
  return "rgb("+start.map((x,i)=>Math.round(x+(end[i]-x)*ratio)).join(",")+")";
}
function rebuildDatasetSettings(){
  const container=$("dataset-settings");container.replaceChildren();
  report.datasets.forEach(d=>{
    const row=el("div",undefined,"dataset-setting");const check=el("input");check.type="checkbox";check.checked=selectedDatasets.has(d.id);check.setAttribute("aria-label","显示 "+d.label);
    check.addEventListener("change",()=>{check.checked?selectedDatasets.add(d.id):selectedDatasets.delete(d.id);page=0;rebuildSort();render();});
    const role=el("select");role.setAttribute("aria-label",d.label+" 的用途");
    const fixed=["development_cv","repeated_cv","internal_external_cv"].includes(d.role);
    const choices=fixed?[d.role]:["external","validation","test","training","unspecified"];
    choices.forEach(r=>role.append(option(r,roleNames[r])));role.value=d.role;role.disabled=fixed;
    role.addEventListener("change",()=>{d.role=role.value;page=0;rebuildSort();render();});
    row.append(check,el("span",d.label),role);container.append(row);
  });
}
function rebuildSort(){
  const old=$("sort").value, ds=datasetList();const sort=$("sort");sort.replaceChildren(option("","输入顺序"));
  ds.forEach(d=>sort.append(option(d.id,d.label+" · "+roleNames[d.role])));
  if($("mean").checked&&ds.some(d=>d.role==="validation"))sort.append(option("@validation_mean","验证集均值"));
  const allowed=Array.from(sort.options).map(o=>o.value);
  sort.value=allowed.includes(old)?old:(allowed.includes(report.default_sort)?report.default_sort:"");
}
function rebuildMetrics(){
  const task=$("task").value, previous=$("metric").value;const metric=$("metric");metric.replaceChildren();
  Object.keys(metricInfo).filter(m=>metricInfo[m].task===task).forEach(m=>{
    if(!metricInfo[m].horizon||report.cells.some(c=>c.task===task&&c.metric===m&&(c.available||finite(c.horizon))))metric.append(option(m,metricInfo[m].name));
  });
  if(Array.from(metric.options).some(o=>o.value===previous))metric.value=previous;
  rebuildHorizons();rebuildSort();page=0;render();
}
function rebuildHorizons(){
  const metric=metricInfo[$("metric").value];$("horizon-control").hidden=!metric.horizon;
  const previous=$("horizon").value;const horizon=$("horizon");horizon.replaceChildren();
  if(metric.horizon){
    const pairs=new Map();report.cells.filter(c=>c.task===$("task").value&&c.metric===$("metric").value&&finite(c.horizon)).forEach(c=>pairs.set(horizonKey(c),String(c.horizon)+" "+(c.time_unit||"")));
    pairs.forEach((label,key)=>horizon.append(option(key,label)));
    if(Array.from(horizon.options).some(o=>o.value===previous))horizon.value=previous;
  }
}
function init(){
  byCell=new Map();report.cells.forEach(c=>byCell.set(cellKey(c.task,c.model,c.dataset,c.metric),c));
  selectedDatasets=new Set(report.datasets.map(d=>d.id));
  $("page-title").textContent=report.title==="Model comparison"?"模型比较":report.title||"模型比较";
  document.title=$("page-title").textContent+" · stormbreaker";
  const taskOptions=Array.from($("task").options),tasks=new Set(report.models.map(m=>m.task));
  taskOptions.forEach(o=>o.disabled=tasks.size>0&&!tasks.has(o.value));
  if(!tasks.has($("task").value)&&tasks.size)$("task").value=Array.from(tasks)[0];
  $("sort").replaceChildren(option(report.default_sort||"",report.default_sort||"输入顺序"));
  $("search").value="";$("mean").checked=false;$("complete").checked=false;page=0;
  rebuildDatasetSettings();rebuildMetrics();
  if(!report.models.length)announce("运行 sb_compare_models() 或 sb_compare_cohorts() 后，即可生成结果页。也可导入已有结果 CSV。");
}
function render(){
  closeExport();
  const task=$("task").value, metric=metricInfo[$("metric").value],ds=datasetList(),query=$("search").value.trim().toLocaleLowerCase();
  const useMean=$("mean").checked&&ds.some(d=>d.role==="validation");
  columnsNow=ds.map(d=>({id:d.id,label:d.label,role:d.role}));
  if(useMean)columnsNow.push({id:"@validation_mean",label:"验证集均值",role:"validation",mean:true,count:ds.filter(d=>d.role==="validation").length});
  let rows=report.models.filter(m=>m.task===task);
  if(query)rows=rows.filter(m=>(m.selector+" "+m.learner+" "+m.id+" "+m.parameters).toLocaleLowerCase().includes(query));
  if($("complete").checked)rows=rows.filter(m=>ds.length>0&&ds.every(d=>{const c=activeCell(m,d.id);return c&&c.available&&finite(c.estimate);}));
  const basis=$("sort").value;
  function score(m){if(basis==="@validation_mean")return validationMean(m,ds);const c=activeCell(m,basis);return c&&c.available?c.estimate:null;}
  if(basis)rows=rows.map((m,i)=>({m,i,v:score(m)})).sort((a,b)=>{
    const av=finite(a.v),bv=finite(b.v);if(av!==bv)return av?-1:1;if(!av)return a.i-b.i;return (metric.higher?b.v-a.v:a.v-b.v)||a.i-b.i;
  }).map(x=>x.m);
  exportRows=rows;
  const limit=$("limit").value;allRows=limit==="all"?rows:rows.slice(0,Number(limit));
  const pageSize=50,pages=Math.max(1,Math.ceil(allRows.length/pageSize));page=Math.min(page,pages-1);rowsNow=allRows.slice(page*pageSize,(page+1)*pageSize);
  const table=$("matrix"),head=table.tHead,body=table.tBodies[0];head.replaceChildren();body.replaceChildren();
  const hr=el("tr");hr.append(el("th","#","col-index"),el("th","Selector","col-selector"),el("th","Learner","col-learner"));
  columnsNow.forEach(d=>{
    const th=el("th",undefined,"metric-head"+(basis===d.id?" sorted":""));th.scope="col";
    const button=el("button",d.label+(basis===d.id?(metric.higher?" ↓":" ↑"):""));button.setAttribute("aria-label","按 "+d.label+" 排序");
    button.addEventListener("click",()=>{$("sort").value=d.id;page=0;render();});
    const subtitle=d.mean?"验证集 · "+d.count+" 个队列":roleNames[d.role];
    th.append(button,el("span",subtitle,"role"));hr.append(th);
  });head.append(hr);
  const groups=new Map();report.models.filter(m=>m.task===task).forEach(m=>{const key=m.selector+"|"+m.learner;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(m.id);});
  rowsNow.forEach((m,i)=>{
    const tr=el("tr");tr.append(el("td",String(page*pageSize+i+1),"row-index"),el("td",m.selector,"selector-label"));
    const learner=el("td",undefined,"learner-cell"),button=el("button",m.learner,"model-button");button.addEventListener("click",()=>showModel(m));
    learner.append(button);const same=groups.get(m.selector+"|"+m.learner);
    if(same.length>1){const variant=el("span","配置 "+(same.indexOf(m.id)+1),"variant");variant.title=m.parameters||m.id;learner.append(variant);}tr.append(learner);
    columnsNow.forEach(d=>{
      const c=d.mean?null:activeCell(m,d.id),value=d.mean?validationMean(m,ds):c&&c.available?c.estimate:null;
      const td=el("td",format(value),"metric-cell"+(!finite(value)?" missing":"")+(d.mean?" mean-cell":""));
      td.dataset.label=d.label+" · "+(d.mean?"均值":roleNames[d.role]);
      td.title=d.mean?"当前 "+d.count+" 个验证队列的等权均值":(c?statusName(c)+(finite(c.n)?" · n = "+c.n:""):"未评估");
      if(finite(value))td.style.backgroundColor=color(value);tr.append(td);
    });body.append(tr);
  });
  $("empty").hidden=rowsNow.length>0;$("matrix").hidden=!rowsNow.length;
  $("summary").textContent=(task==="binary"?"二分类":"生存预测")+" · "+report.models.filter(m=>m.task===task).length+" 条管道 · "+ds.length+" 个结果集";
  $("matrix-title").textContent=metric.name+(metric.horizon&&$("horizon").selectedOptions.length?" · "+$("horizon").selectedOptions[0].textContent:"");
  $("row-count").textContent=allRows.length+" / "+rows.length+" 条";
  const sortLabel=$("sort").selectedOptions[0]?$("sort").selectedOptions[0].textContent:"输入顺序";
  $("sort-note").textContent="排序："+sortLabel+" · "+(metric.higher?"数值越高越好":"数值越低越好")+" · — 未评估或不可用";
  $("pagination-label").textContent=(page+1)+" / "+pages;$("previous").disabled=page===0;$("next").disabled=page>=pages-1;
  $("csv-button").disabled=allRows.length===0;$("svg-button").disabled=rowsNow.length===0;
}
function showModel(m){
  $("detail-title").textContent=m.learner;$("detail-selector").textContent="Selector · "+m.selector;
  const meta=$("model-meta");meta.replaceChildren();
  [["任务",m.task==="binary"?"二分类":"生存预测"],["当前指标",$("matrix-title").textContent],["学习器",m.learner],["筛选方法",m.selector]].forEach(([name,value])=>meta.append(el("dt",name),el("dd",value)));
  const body=$("detail-table").tBodies[0];body.replaceChildren();
  datasetList().forEach(d=>{const c=activeCell(m,d.id),tr=el("tr");[d.label,roleNames[d.role],format(c&&c.available?c.estimate:null),statusName(c)].forEach(t=>tr.append(el("td",t)));body.append(tr);});
  $("detail-parameters").textContent="Learner: "+(m.parameters||"未随结果记录")+"\nSelector: "+(m.selection_parameters||"无附加参数");
  $("detail-id").textContent=m.id;
  $("model-dialog").showModal();
}
function csvValue(value){const text=value===null||value===undefined?"":String(value);return '"'+text.replace(/"/g,'""')+'"';}
function exposeDownload(content,type,filename,message,preview){
  closeExport();objectUrl=URL.createObjectURL(new Blob([content],{type}));
  $("download-link").href=objectUrl;$("download-link").download=filename;$("download-link").textContent="保存 "+filename;
  $("export-status").textContent=message;$("export-box").hidden=false;$("csv-preview").hidden=!preview;
  if(preview)$("csv-preview").value=content;
  $("download-link").click();
}
function exportCSV(){
  const header=["pipeline_id","selector","learner","dataset","role","task_type","metric","prediction_horizon","time_unit","estimate","metric_status","run_status","scope","aggregation"];
  const lines=[header.map(csvValue).join(",")];
  exportRows.forEach(m=>datasetList().forEach(d=>{
    const c=activeCell(m,d.id);
    const values=[m.id,m.selector,m.learner,d.label,d.role,m.task,$("metric").value,c?c.horizon:null,c?c.time_unit:"",c?c.estimate:null,c?c.metric_status:"not_supplied",c?c.run_status:"not_supplied",c?c.scope:"",c?c.aggregation:""];
    lines.push(values.map(csvValue).join(","));
  }));
  exposeDownload("\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8","stormbreaker-"+$("task").value+"-"+$("metric").value+".csv","CSV 已生成，保留完整数值与管道编号。",true);
}
function exportSVG(){
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
  const widths=[46,190,260,...columnsNow.map(()=>140)],total=widths.reduce((a,b)=>a+b,0),rh=43,top=100,height=top+rowsNow.length*rh+36;
  svg.setAttribute("xmlns",ns);svg.setAttribute("width",total+36);svg.setAttribute("height",height);svg.setAttribute("viewBox","0 0 "+(total+36)+" "+height);
  function shape(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n);return n;}
  function text(value,x,y,size=12,weight=400){const n=shape("text",{x,y,"font-family":"Arial, Microsoft YaHei, sans-serif","font-size":size,"font-weight":weight,fill:"#21332f"});n.textContent=value;return n;}
  shape("rect",{width:"100%",height:"100%",fill:"white"});text($("page-title").textContent+" · "+$("matrix-title").textContent,18,30,19,600);
  const headers=["#","Selector","Learner",...columnsNow.map(d=>d.label)];let x=18;
  headers.forEach((h,i)=>{shape("rect",{x,y:48,width:widths[i],height:44,fill:"#eef3ef"});text(h,x+9,67,12,600);if(i>2)text(columnsNow[i-3].mean?"验证均值":roleNames[columnsNow[i-3].role],x+9,83,10);x+=widths[i];});
  rowsNow.forEach((m,i)=>{
    const y=top+i*rh;let px=18;
    [String(page*50+i+1),m.selector,m.learner].forEach((value,j)=>{const max=j===2?34:25;const s=value.length>max?value.slice(0,max-1)+"…":value;text(s,px+9,y+25,12,j===2?600:400);px+=widths[j];});
    columnsNow.forEach((d,j)=>{const c=d.mean?null:activeCell(m,d.id),value=d.mean?validationMean(m,datasetList()):c&&c.available?c.estimate:null;shape("rect",{x:px+2,y:y+2,width:widths[j+3]-4,height:rh-4,fill:finite(value)?color(value):"#f4f5f2"});text(format(value),px+45,y+25,13,600);px+=widths[j+3];});
    shape("line",{x1:18,y1:y+rh,x2:total+18,y2:y+rh,stroke:"#e5eae6"});
  });
  text($("sort-note").textContent,18,height-10,10);
  exposeDownload(new XMLSerializer().serializeToString(svg),"image/svg+xml;charset=utf-8","stormbreaker-matrix.svg","SVG 已生成，包含当前页 "+rowsNow.length+" 条管道。",false);
}
function parseCSV(text){
  const rows=[];let row=[],value="",quoted=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){value+='"';i++;}else if(c==='"')quoted=false;else value+=c;}
    else if(c==='"'){if(value.length)throw Error("CSV 引号格式不正确。");quoted=true;}
    else if(c===","){row.push(value);value="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(value);if(row.some(v=>v.length))rows.push(row);row=[];value="";}
    else value+=c;
  }
  if(quoted)throw Error("CSV 引号未闭合。");if(value.length||row.length){row.push(value);rows.push(row);}if(rows.length<2)throw Error("CSV 中没有结果记录。");
  const headers=rows.shift();if(new Set(headers).size!==headers.length)throw Error("CSV 列名重复。");
  return rows.map((r,i)=>{if(r.length!==headers.length)throw Error("第 "+(i+2)+" 行列数不一致。");return Object.fromEntries(headers.map((h,j)=>[h,r[j]]));});
}
function number(value){if(value===undefined||value===null||["","NA","NaN","null"].includes(String(value).trim()))return null;const n=Number(value);if(!Number.isFinite(n))return null;return n;}
function prettyImported(id,pipeline=""){
  const names={none:"None",logistic:"Logistic regression",coxph:"Cox regression",gaussian_naive_bayes:"Gaussian naive Bayes",ranger_binary_fixed:"Random forest (ranger)",ranger_survival_fixed:"Random survival forest (ranger)",ridge_logistic:"Ridge logistic",ridge_cox:"Ridge Cox",glmnet_logistic:"Lasso logistic",glmnet_cox:"Lasso Cox",boruta_binary_roughfix:"Boruta",boruta_survival_roughfix:"Boruta",varselrf_binary_oob_1se:"varSelRF"};
  if(["glmnet_logistic","glmnet_cox"].includes(id)){
    const a=pipeline.match(/(?:^|__)alpha([0-9.]+)(?:__|$)/),alpha=a?Number(a[1]):/^ridge_/.test(pipeline)?0:/^elastic_net_/.test(pipeline)?.5:1;
    return (alpha===0?"Ridge":alpha===1?"Lasso":"Elastic net")+(id==="glmnet_cox"?" Cox":" logistic");
  }
  if(names[id])return names[id];return String(id||"Model").split("_").filter(t=>!["fixed","binary","survival"].includes(t)).join(" ").replace(/\b(xgboost|lightgbm|catboost|svm|gbm|fda|pda|mda|lda|qda|bart)\b/gi,s=>({xgboost:"XGBoost",lightgbm:"LightGBM",catboost:"CatBoost"}[s.toLowerCase()]||s.toUpperCase()));
}
async function importFiles(files){
  try{
    const datasets=new Map(),models=new Map(),cells=[],seen=new Set();
    for(const file of files){
      const rows=parseCSV(await file.text());
      rows.forEach(r=>{
        const id=r.pipeline_id||r.model_id;if(!id)throw Error("缺少 pipeline_id 或 model_id 列。");
        const legacy=r.cv_status!==undefined;
        const type=r.task_type||(r.roc_auc!==undefined?"binary":r.harrell_c!==undefined?"survival":null);
        if(!["binary","survival"].includes(type))throw Error("请提供 task_type（binary 或 survival）。");
        const dataset=r.dataset||r.cohort_id||file.name.replace(/\.csv$/i,"");
        const role=r.role||r.cohort_role||(legacy?"development_cv":"unspecified");
        if(!Object.hasOwn(roleNames,role))throw Error("数据集 role 不正确："+role);
        if(datasets.has(dataset)&&datasets.get(dataset).role!==role)throw Error("同一数据集的用途不一致："+dataset);
        datasets.set(dataset,{id:dataset,label:dataset,role});
        const tokens=id.split("__"),sel=r.selector||tokens[0],learner=r.learner||tokens[1]||r.model_id||id;
        models.set(type+"::"+id,{id,task:type,selector:prettyImported(sel),learner:r.model_label||prettyImported(learner,id),selector_id:sel,learner_id:learner,parameters:"",selection_parameters:""});
        let metrics=r.metric?[r.metric]:Object.keys(metricInfo).filter(m=>r[m]!==undefined&&metricInfo[m].task===type);
        if(legacy)metrics=[type==="binary"?"roc_auc":"harrell_c"];
        if(!metrics.length)throw Error("找不到可用指标列。");
        metrics.forEach(metric=>{
          if(!metricInfo[metric]||metricInfo[metric].task!==type)throw Error("指标与任务不匹配："+metric);
          const estimate=number(r.metric?r.estimate:legacy?r.primary_metric:r[metric]);
          const run=r.run_status||r.cv_status||r.status||"success";
          const status=r.metric_status||r.primary_metric_status||r[metric+"_status"]||(estimate===null?"not_saved":"success");
          const key=cellKey(type,id,dataset,metric);if(seen.has(key))throw Error("同一管道、数据集和指标出现重复记录，请分别命名结果集。");seen.add(key);
          cells.push({model:id,task:type,dataset,metric,estimate,metric_status:status,run_status:run,
            available:run==="success"&&status==="success"&&finite(estimate),
            horizon:number(r.prediction_horizon),time_unit:r.time_unit||"",n:number(r.n||r.development_n),
            scope:r.scope||(legacy?"development_cv":""),aggregation:r.aggregation||"",error_stage:"",error_class:""});
        });
      });
    }
    const ds=Array.from(datasets.values()),dev=ds.find(d=>d.role==="development_cv");
    report={title:"模型比较",datasets:ds,models:Array.from(models.values()),cells,default_sort:dev?dev.id:""};
    init();announce("已载入 "+files.length+" 个文件。可在“数据集与用途”中标记验证集和测试集。");
  }catch(error){announce(error.message,true);}
}
$("task").addEventListener("change",rebuildMetrics);
$("metric").addEventListener("change",()=>{rebuildHorizons();page=0;render();});
$("horizon").addEventListener("change",()=>{page=0;render();});
["search","limit","sort","complete"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",()=>{page=0;render();}));
$("mean").addEventListener("change",()=>{page=0;rebuildSort();render();});
$("previous").addEventListener("click",()=>{page--;render();});
$("next").addEventListener("click",()=>{page++;render();});
$("close-dialog").addEventListener("click",()=>$("model-dialog").close());
$("model-dialog").addEventListener("click",e=>{if(e.target===$("model-dialog"))$("model-dialog").close();});
$("csv-button").addEventListener("click",exportCSV);$("svg-button").addEventListener("click",exportSVG);
$("close-export").addEventListener("click",closeExport);$("print-button").addEventListener("click",()=>window.print());
$("import-button").addEventListener("click",()=>$("file-input").click());
$("file-input").addEventListener("change",async e=>{if(e.target.files.length)await importFiles(Array.from(e.target.files));e.target.value="";});
init();
